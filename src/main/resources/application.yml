spring:
  application:
    name: enterprise-notification-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:ma1n}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    root: INFO
    com.enterprise.notification: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
